[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # opentimestamps is CommonJS with dynamic require()s that esbuild cannot inline
  # into the ESM bundle (it throws `Dynamic require of "util"` at runtime).
  # Keeping it external lets Node load it natively. See netlify/functions/_ots.js.
  external_node_modules = ["opentimestamps"]

[[scheduled-functions]]
  name = "crawler-all"
  cron = "*/10 * * * *"

[[scheduled-functions]]
  name = "anchor-checker"
  cron = "*/10 * * * *"

[[scheduled-functions]]
  name = "crawler-new"
  cron = "*/10 * * * *"

[[scheduled-functions]]
  name = "queue-drainer"
  cron = "*/5 * * * *"

# Three parallel backfill workers — each runs every 5 min simultaneously.
# Worker A: ascending order (oldest rows first)
# Worker B: descending order (newest rows first)  
# Worker C: rubygems + cargo specialist (30k rows combined)
# Combined: ~3x throughput, ~5 days to clear all 97k legacy rows.
# Remove all three once remaining=0.
[[scheduled-functions]]
  name = "backfill"
  cron = "*/5 * * * *"

[[scheduled-functions]]
  name = "backfill-b"
  cron = "*/5 * * * *"

[[scheduled-functions]]
  name = "backfill-c"
  cron = "*/5 * * * *"

[[scheduled-functions]]
  name = "pruner"
  cron = "0 3 * * *"

