[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[scheduled-functions]]
  name = "crawler-all"
  cron = "*/10 * * * *"

[[scheduled-functions]]
  name = "anchor-checker"
  cron = "*/10 * * * *"

[[redirects]]
  from = "/capture"
  to = "/capture.html"
  status = 200

[[redirects]]
  from = "/browse"
  to = "/browse.html"
  status = 200

[[redirects]]
  from = "/verify"
  to = "/verify.html"
  status = 200

[[redirects]]
  from = "/package"
  to = "/package.html"
  status = 200

[[redirects]]
  from = "/license"
  to = "/license.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/api"
  to = "/api.html"
  status = 200

[[redirects]]
  from = "/badge"
  to = "/badge.html"
  status = 200

[[redirects]]
  from = "/webhooks"
  to = "/webhooks.html"
  status = 200

[[redirects]]
  from = "/incidents"
  to = "/incidents.html"
  status = 200

[[scheduled-functions]]
  name = "crawler-new"
  cron = "*/10 * * * *"

[[scheduled-functions]]
  name = "pruner"
  cron = "0 3 * * *"
