<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prechained — Browse</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f0ede8;--off:#e8e4de;--white:#ffffff;--border:#d8d3cc;
  --ink:#111;--ink-2:#222;--ink-3:#444;
  --accent:#e8390e;--green:#16a34a;--green-bg:#dcfce7;
  --mono:'JetBrains Mono',monospace;--serif:'Instrument Serif',serif;--sans:'Inter',sans-serif;
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;margin:0;}
nav{height:52px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100;}
.logo{font-family:var(--serif);font-size:19px;color:var(--ink);text-decoration:none;}
.logo b{color:var(--accent);}
.nav-r{display:flex;align-items:center;gap:20px;}
.nav-r a{font-size:13px;color:#333;text-decoration:none;font-weight:500;}
.nav-r a:hover,.nav-r a.active{color:var(--accent);}
.live-pill{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--green);font-family:var(--mono);}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}

.page-header{padding:36px 32px 24px;border-bottom:1px solid var(--border);background:var(--off);}
.page-header-inner{max-width:960px;margin:0 auto;}
.page-title{font-family:var(--serif);font-size:32px;font-weight:400;letter-spacing:-.02em;margin-bottom:4px;}
.page-title i{color:var(--accent);}
.page-sub{font-size:13px;color:var(--ink-2);margin-bottom:20px;}

.search-wrap{position:relative;margin-bottom:14px;}
.search-input{width:100%;font-family:var(--mono);font-size:13px;padding:11px 14px 11px 38px;border:1px solid var(--border);border-radius:6px;background:var(--white);color:var(--ink);outline:none;transition:border-color .15s;}
.search-input:focus{border-color:var(--ink);}
.search-input::placeholder{color:var(--ink-3);}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--ink-3);pointer-events:none;}

.filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.fl{font-size:11px;color:var(--ink-3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;margin-right:4px;font-weight:600;}
.filt{font-size:11px;font-weight:500;padding:4px 11px;border-radius:100px;border:1px solid var(--border);background:var(--white);color:var(--ink-2);cursor:pointer;transition:all .15s;white-space:nowrap;}
.filt:hover{border-color:var(--ink-2);}
.filt.on{border-color:var(--ink);background:var(--ink);color:#fff;}

.main{max-width:960px;margin:0 auto;padding:20px 32px;}
.meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.meta-count{font-size:12px;color:var(--ink-3);font-family:var(--mono);font-weight:500;}
.meta-refresh{font-size:11px;color:var(--green);font-family:var(--mono);}

.pkg-list{display:flex;flex-direction:column;gap:4px;}

/* FIXED GRID - no overflow possible */
.pkg-card{
  background:var(--white);border:1px solid var(--border);border-radius:6px;
  padding:13px 14px;
  display:grid;
  grid-template-columns:minmax(0,1.8fr) 80px minmax(0,1fr) 80px 90px;
  gap:10px;align-items:center;cursor:pointer;transition:all .12s;
}
.pkg-card:hover{border-color:var(--ink-3);box-shadow:0 2px 8px rgba(0,0,0,.06);}
.pc-cell{overflow:hidden;min-width:0;}
.pc-name{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pc-desc{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.eco{font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px;font-family:var(--mono);white-space:nowrap;display:inline-block;}
.e-npm{background:#fff7ed;color:#c2410c;}
.e-pypi{background:#eff6ff;color:#1d4ed8;}
.e-maven{background:#fdf4ff;color:#7e22ce;}
.e-cargo{background:#fef2f2;color:#b91c1c;}
.e-go{background:#ecfeff;color:#0e7490;}
.e-nuget{background:#f5f3ff;color:#6d28d9;}
.e-gh{background:#f0fdf4;color:#15803d;}
.pc-ver{font-size:11px;color:var(--ink-2);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pc-ver-sub{font-size:10px;color:var(--ink-3);margin-top:2px;white-space:nowrap;}
.pc-date{font-size:11px;color:var(--ink-2);font-family:var(--mono);white-space:nowrap;}
.st{font-size:11px;font-weight:600;padding:2px 9px;border-radius:100px;white-space:nowrap;display:inline-block;}
.s-ok{background:var(--green-bg);color:var(--green);}

.loading{text-align:center;padding:40px;font-size:12px;color:var(--ink-3);font-family:var(--mono);}

.pagination{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:20px;padding-top:18px;border-top:1px solid var(--border);}
.pg-btn{font-size:12px;font-family:var(--mono);padding:5px 11px;border-radius:5px;border:1px solid var(--border);background:var(--white);color:var(--ink-2);cursor:pointer;transition:all .15s;}
.pg-btn:hover{border-color:var(--ink);}
.pg-btn.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.pg-btn:disabled{opacity:.3;cursor:default;}

footer{border-top:1px solid var(--border);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-3);flex-wrap:wrap;gap:10px;margin-top:32px;}
footer a{color:var(--ink-2);text-decoration:none;font-weight:500;}
footer a:hover{color:var(--accent);}
@media(max-width:700px){
  nav{padding:0 16px;}
  .page-header{padding:24px 16px 18px;}
  .main{padding:16px;}
  .pkg-card{grid-template-columns:minmax(0,1fr) 65px 72px;}
  .pkg-card>*:nth-child(4),.pkg-card>*:nth-child(5){display:none;}
  footer{padding:14px 16px;}
}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">Pre<b>chained</b></a>
  <div class="nav-r">
    <div class="live-pill"><div class="dot"></div>Recording</div>
    <a href="/">Home</a>
    <a href="/browse.html" class="active">Browse</a>
    <a href="/verify.html">Verify</a>
    <a href="https://github.com/ngr-dev1/prechained">GitHub</a>
  </div>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <div class="page-title">Browse the <i>archive.</i></div>
    <div class="page-sub"><b id="pkg-total">—</b> packages · <b id="snap-total">—</b> snapshots · live</div>
    <div class="search-wrap">
      <div class="search-icon">🔍</div>
      <input class="search-input" type="text" placeholder="Search packages... e.g. express, lodash, react" id="search-input"/>
    </div>
    <div class="filter-row">
      <span class="fl">Ecosystem</span>
      <button class="filt on" data-eco="">All</button>
      <button class="filt" data-eco="npm">npm</button>
      <button class="filt" data-eco="pypi">PyPI</button>
      <button class="filt" data-eco="github">GitHub</button>
      <button class="filt" data-eco="maven">Maven</button>
      <button class="filt" data-eco="cargo">Cargo</button>
      <button class="filt" data-eco="go">Go</button>
      <button class="filt" data-eco="nuget">NuGet</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="meta">
    <div class="meta-count" id="results-count">Loading...</div>
    <div class="meta-refresh" id="meta-refresh">● live · refreshes every 10s</div>
  </div>
  <div class="pkg-list" id="pkg-list"><div class="loading">Loading packages...</div></div>
  <div class="pagination" id="pagination"></div>
</div>

<footer>
  <span>Prechained · Built by <a href="https://nextgenrails.net">NextGenRails™</a></span>
  <span><a href="https://github.com/ngr-dev1/prechained">GitHub</a> &nbsp;·&nbsp; <a href="/verify.html">Verify</a> &nbsp;·&nbsp; <a href="#">API</a></span>
</footer>

<script>
let page=1,eco='',q='',timer;

function ecoC(e){
  const m={npm:'e-npm',pypi:'e-pypi',maven:'e-maven',cargo:'e-cargo',go:'e-go',nuget:'e-nuget',github:'e-gh'};
  return m[(e||'').toLowerCase()]||'e-npm';
}
function ago(d){
  const s=Math.floor((Date.now()-new Date(d))/1000);
  if(s<60)return s+'s ago';
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  return new Date(d).toLocaleDateString();
}

async function loadStats(){
  try{
    const r=await fetch('/.netlify/functions/stats?t='+Date.now());
    const d=await r.json();
    document.getElementById('pkg-total').textContent=d.total_packages.toLocaleString();
    document.getElementById('snap-total').textContent=d.total_snapshots.toLocaleString();
  }catch(e){}
}

async function loadPkgs(){
  let url=`/.netlify/functions/packages?page=${page}`;
  if(eco)url+=`&ecosystem=${encodeURIComponent(eco)}`;
  if(q)url+=`&q=${encodeURIComponent(q)}`;
  try{
    const r=await fetch(url+'&t='+Date.now());
    const d=await r.json();
    const total=d.total||0;
    const from=((page-1)*20)+1;
    const to=Math.min(page*20,total);
    document.getElementById('results-count').textContent=
      total>0?`Showing ${from}–${to} of ${total.toLocaleString()} packages`:'No packages found';
    if(!d.packages?.length){
      document.getElementById('pkg-list').innerHTML='<div class="loading">No packages yet — crawler is running.</div>';
      return;
    }
    document.getElementById('pkg-list').innerHTML=d.packages.map(p=>`
      <div class="pkg-card" onclick="location='/package.html?id=${p.id}'">
        <div class="pc-cell">
          <div class="pc-name">${p.name}</div>
          <div class="pc-desc">${(p.description||'No description').substring(0,60)}</div>
        </div>
        <div class="pc-cell"><span class="eco ${ecoC(p.ecosystem)}">${p.ecosystem}</span></div>
        <div class="pc-cell">
          <div class="pc-ver">${p.total_versions} versions</div>
          <div class="pc-ver-sub">v${p.latest_version||'—'}</div>
        </div>
        <div class="pc-cell"><div class="pc-date">${ago(p.last_captured_at)}</div></div>
        <div class="pc-cell"><span class="st s-ok">✓ Recorded</span></div>
      </div>
    `).join('');
    renderPages(total);
  }catch(e){
    document.getElementById('pkg-list').innerHTML='<div class="loading">Error loading — retrying...</div>';
  }
}

function renderPages(total){
  const pages=Math.ceil(total/20);
  if(pages<=1){document.getElementById('pagination').innerHTML='';return;}
  let h=`<button class="pg-btn" onclick="goPage(${page-1})" ${page===1?'disabled':''}>←</button>`;
  for(let i=1;i<=Math.min(pages,7);i++)h+=`<button class="pg-btn ${i===page?'on':''}" onclick="goPage(${i})">${i}</button>`;
  if(pages>7)h+=`<span style="font-size:12px;color:var(--ink-3);font-family:var(--mono);">...</span>`;
  h+=`<button class="pg-btn" onclick="goPage(${page+1})" ${page===pages?'disabled':''}>→</button>`;
  document.getElementById('pagination').innerHTML=h;
}

function goPage(p){if(p<1)return;page=p;loadPkgs();window.scrollTo(0,0);}

document.querySelectorAll('.filt').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.filt').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    eco=b.dataset.eco;page=1;loadPkgs();
  });
});

document.getElementById('search-input').addEventListener('input',function(){
  clearTimeout(timer);
  timer=setTimeout(()=>{q=this.value.trim();page=1;loadPkgs();},400);
});

loadStats();
loadPkgs();

// Auto-refresh every 10 seconds
setInterval(()=>{
  loadStats();
  if(!q&&!eco&&page===1)loadPkgs();
},10000);
</script>
</body>
</html>
